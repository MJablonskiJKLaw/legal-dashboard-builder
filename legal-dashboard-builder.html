<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal Dashboard Builder</title>
<meta name="description" content="Turn a memorandum, legal opinion, analysis or pleading into an interactive dashboard with charts, timelines and quotations linked to the full document.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>:root{--desk:#E8ECEF;--paper:#FFFFFF;--ink:#1B2230;--muted:#5B6576;--line:#D3D9E0;--green:#1F5C4A;--green-ink:#FFFFFF;--hl:#F4D35E;--hl-ink:#1B2230;--warn:#9A3412;--warn-bg:#FFF1E6;--ok:#1F5C4A;--ok-bg:#E6F2EC;--shadow:0 1px 2px rgba(20,30,40,.06);
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#14171C;--paper:#1C2027;--ink:#E5E8EE;--muted:#9AA3B2;--line:#2E353F;--green:#6FB59B;--green-ink:#0E1A15;--hl:#E9C949;--hl-ink:#15130A;--warn:#F2A57A;--warn-bg:#3A2418;--ok:#8FD0B5;--ok-bg:#16302A;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#14171C;--paper:#1C2027;--ink:#E5E8EE;--muted:#9AA3B2;--line:#2E353F;--green:#6FB59B;--green-ink:#0E1A15;--hl:#E9C949;--hl-ink:#15130A;--warn:#F2A57A;--warn-bg:#3A2418;--ok:#8FD0B5;--ok-bg:#16302A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{font-family:"Newsreader",Georgia,serif;font-weight:500;margin:0;line-height:1.2;letter-spacing:-.005em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .in{max-width:1240px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:24px}
.brand{font-family:"Newsreader",Georgia,serif;font-size:20px;white-space:nowrap;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:22px;height:14px;background:var(--hl);border-radius:2px;transform:skewX(-12deg)}
.stepper{display:flex;gap:6px;list-style:none;margin:0 auto;padding:0;counter-reset:st}
.stepper li{counter-increment:st;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:6px 10px;border-radius:999px}
.stepper li::before{content:counter(st);width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px}
.stepper li.on{color:var(--ink);background:var(--desk)}
.stepper li.on::before{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stepper li.done::before{content:"\2713";background:var(--green);color:var(--green-ink);border-color:var(--green)}
.bar .tools{display:flex;gap:8px}
.chipbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.langsel{appearance:auto;width:auto;padding:5px 8px}
.chipbtn:hover{border-color:var(--ink)}
@media (max-width:820px){.stepper li span{display:none}.brand b{display:none}.bar .in{gap:12px}}

.notice{max-width:1240px;margin:16px auto 0;padding:12px 16px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.notice[hidden]{display:none}
main{max-width:1240px;margin:0 auto;padding:28px 20px 120px}

/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:24px}
.intro h1{font-size:clamp(28px,3.6vw,40px);max-width:22ch}
.intro p{color:var(--muted);margin-top:10px;max-width:70ch}
@media (max-width:760px){.intro{grid-template-columns:1fr}}

/* panels */
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:20px}
.panel h2{font-size:21px;margin-bottom:4px}
.panel .hint{color:var(--muted);font-size:14px;margin-bottom:16px}
.field{margin-top:16px}
.field>label,.field>.lab{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field .sub{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 11px;line-height:1.45}
textarea{resize:vertical;min-height:84px}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}

/* drop zone */
.drop{display:block;border:1.5px dashed var(--line);border-radius:10px;padding:26px 18px;text-align:center;cursor:pointer;background:color-mix(in srgb,var(--desk) 40%,var(--paper));transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--green);background:color-mix(in srgb,var(--green) 6%,var(--paper))}
.drop b{display:block;font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:19px}
.drop span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.docinfo{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:8px;margin-top:12px}
.docinfo .ic{width:40px;height:48px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none;position:relative}
.docinfo .ic::after{content:"";position:absolute;left:8px;right:8px;bottom:9px;height:5px;background:var(--hl);opacity:.85}
.docinfo .nm{font-weight:600;overflow-wrap:anywhere}
.docinfo .mt{color:var(--muted);font-size:13px}
.docinfo .x{margin-left:auto}
.linkbtn{border:0;background:none;color:var(--green);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.or{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}

/* presets */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.preset{border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;background:var(--paper);text-align:left}
.preset[aria-pressed=true]{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.preset .sw{display:flex;height:22px;border-radius:4px;overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}
.preset .sw i{flex:1}
.preset .pn{font-size:14px;font-weight:600}
.preset .pf{font-size:12px;color:var(--muted)}

/* images */
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.imgc{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.imgc .th{aspect-ratio:4/3;background:var(--desk) center/cover no-repeat}
.imgc .th.logo{background-size:contain;background-origin:content-box;padding:12px}
.imgc .meta{padding:8px;display:grid;gap:6px}
.imgc .meta .nm{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imgc select{padding:5px 8px;font-size:13px}
.imgc .rm{border:0;background:none;color:var(--warn);font-size:13px;cursor:pointer;padding:0;justify-self:start}

/* action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.actions .in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.actions .msg{color:var(--muted);font-size:14px;margin-right:auto;min-width:0}
.btn{border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--desk)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.btn.sm{padding:6px 12px;font-size:13px;font-weight:500}
.btn.ghost{border-color:var(--line)}

/* plan */
.plan{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:1040px){.plan{grid-template-columns:1fr}}
.spine{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.spine label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.spine textarea{font-family:"Newsreader",Georgia,serif;font-size:20px;min-height:58px;border:0;padding:0;background:none}
.spine textarea:focus{box-shadow:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px;font-size:14px;color:var(--muted)}
.cards{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:grid;grid-template-columns:34px minmax(0,1fr);transition:box-shadow .15s,opacity .15s}
.card.sel{border-color:var(--green);box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 40%,transparent)}
.card.dragging{opacity:.4}
.card.drop-before{box-shadow:0 -3px 0 var(--green)}
.card.drop-after{box-shadow:0 3px 0 var(--green)}
.card .grip{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;cursor:grab;color:var(--muted);border-radius:10px 0 0 10px;background:color-mix(in srgb,var(--desk) 45%,var(--paper))}
.card .grip:active{cursor:grabbing}
.card .grip .n{font-size:12px;font-weight:700;color:var(--ink)}
.card .grip svg{width:14px;height:14px}
.card .bd{padding:14px 16px;min-width:0}
.card .r1{display:grid;grid-template-columns:auto 150px minmax(0,1fr) auto;gap:10px;align-items:center}
.card .r1 input[type=checkbox]{width:18px;height:18px;accent-color:var(--green)}
.card .r1 select{padding:6px 8px;font-size:13px}
.card .r1 .ti{font-family:"Newsreader",Georgia,serif;font-size:18px;padding:5px 8px;border-color:transparent;background:none}
.card .r1 .ti:hover{border-color:var(--line)}
.card .ops{display:flex;gap:2px}
.iconbtn{border:1px solid transparent;background:none;border-radius:6px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{border-color:var(--line);color:var(--ink)}
.iconbtn.danger:hover{color:var(--warn)}
.iconbtn svg{width:16px;height:16px}
.card .pur{color:var(--muted);font-size:14px;margin-top:6px}
.card details{margin-top:8px}
.card summary{cursor:pointer;font-size:13px;color:var(--muted)}
.card .pts{margin-top:8px;font-size:14px;min-height:96px}
.card .r3{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:10px;align-items:start}
.card .r3.img{grid-template-columns:minmax(0,1fr) 200px}
.card .cm{min-height:40px;height:40px;font-size:14px;background:color-mix(in srgb,var(--hl) 14%,var(--paper));border-color:color-mix(in srgb,var(--hl) 55%,var(--line))}
.card .cm:focus{height:84px}
.card .qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qchip{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
.qchip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.qchip.bad{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:var(--desk);color:var(--muted);margin-left:6px;vertical-align:middle}
@media (max-width:640px){.card .r1{grid-template-columns:auto minmax(0,1fr)}.card .r1 select{grid-column:2}.card .r1 .ti{grid-column:1 / -1}.card .ops{grid-column:1 / -1}.card .r3{grid-template-columns:1fr}}

.side{position:sticky;top:84px;display:grid;gap:14px}
@media (max-width:1040px){.side{position:static}}
.side .panel{padding:18px}
.side h3{font-size:17px;margin-bottom:8px}
.vers{display:flex;gap:6px;flex-wrap:wrap}
.vers button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
.vers button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qlist{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto;display:grid;gap:8px}
.qlist li{font-size:13px;border-left:3px solid var(--ok);padding:2px 0 2px 10px}
.qlist li.bad{border-color:var(--warn)}
.qlist .qt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qlist .qs{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qlist .qs button{border:0;background:none;color:var(--warn);cursor:pointer;padding:0;font-size:12px;text-decoration:underline}
.tokens{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tokens label{display:flex;align-items:center;gap:8px;font-size:13px}
.tokens input[type=color]{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--paper);flex:none}
.fonts{margin-top:10px;display:grid;gap:6px;font-size:13px}
.fonts input{padding:6px 8px;font-size:13px}

/* busy */
.busy{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--desk) 70%,transparent);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px}
.busy[hidden]{display:none}
.busy .box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:26px 28px;width:min(480px,100%);box-shadow:0 20px 60px rgba(0,0,0,.18)}
.busy h2{font-size:22px}
.busy .st{margin-top:10px;color:var(--muted);font-size:14px;min-height:42px}
.busy .line{height:4px;background:var(--desk);border-radius:4px;overflow:hidden;margin-top:16px;position:relative}
.busy .line i{position:absolute;inset:0 auto 0 0;width:30%;background:var(--hl);border-radius:4px;animation:slide 1.4s ease-in-out infinite}
.busy .prog{list-style:none;margin:14px 0 0;padding:0;font-size:13px;display:grid;gap:4px;max-height:200px;overflow:auto}
.busy .prog li{color:var(--muted)}
.busy .prog li.done{color:var(--ok)}
.busy .prog li.done::before{content:"\2713  "}
.busy .prog li.err{color:var(--warn)}
.busy .row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px;color:var(--muted)}
@keyframes slide{0%{left:-30%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.busy .line i{animation:none;width:100%;opacity:.5}}

/* deploy */
.deploy .frame{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.deploy .fbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.deploy .fbar .dots{display:flex;gap:6px}
.deploy .fbar .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.deploy .fbar .u{font-size:13px;color:var(--muted);margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.deploy .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.deploy .seg button{border:0;background:none;padding:5px 10px;font-size:13px;cursor:pointer}
.deploy .seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.deploy iframe{display:block;width:100%;height:78vh;border:0;background:#fff;margin:0 auto;transition:width .2s}
.deploy iframe.mobile{width:390px;max-width:100%}
.howto{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.howto .panel h3{font-size:17px;margin-bottom:6px}
.howto .panel p{color:var(--muted);font-size:14px}
.copyarea{margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;height:120px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.toast[hidden]{display:none}

/* review */
.rv-top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.rv-counts{display:flex;align-items:center;gap:6px;font-weight:600;flex-wrap:wrap}
.rv-counts .lg{width:12px;height:12px;border-radius:3px;display:inline-block;margin-left:6px}
.lg.g,.rv-badge.g{background:#2E7D4F}.lg.y,.rv-badge.y{background:#E2B536}.lg.r,.rv-badge.r{background:#C2410C}
.rv-sum{font-weight:400;color:var(--muted);font-size:13px;margin-left:10px}
.rv-bulk{display:flex;gap:8px;flex-wrap:wrap}
.rv-src{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.rv-sh{padding:16px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--desk) 40%,var(--paper))}
.rv-sh.ok{box-shadow:inset 4px 0 0 #2E7D4F}
.rv-sh h2{font-size:20px}
.rv-sf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.rv-sf label span,.rv-loc span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
@media (max-width:700px){.rv-sf{grid-template-columns:1fr}}
.rv-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.rv-q{padding:16px 18px;border-top:1px solid var(--line);border-left:5px solid transparent}
.rv-q:first-of-type{border-top:0}
.rv-q.lvl-g{border-left-color:#2E7D4F}.rv-q.lvl-y{border-left-color:#E2B536}.rv-q.lvl-r{border-left-color:#C2410C}
.rv-q.acc{background:color-mix(in srgb,#2E7D4F 6%,var(--paper))}
.rv-q.rem{opacity:.6}
.rv-q.rem .rv-qt{text-decoration:line-through}
.rv-qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.rv-badge{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;color:#fff}
.rv-badge.y{color:#2A2205}
.rv-badge.acc{background:var(--ok-bg);color:var(--ok)}
.rv-badge.rem{background:var(--desk);color:var(--muted)}
.rv-id{margin-left:auto;font-size:12px;color:var(--muted)}
.rv-qb{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:12px}
@media (max-width:700px){.rv-qb{grid-template-columns:1fr}}
.rv-qt-in{font-family:"Newsreader",Georgia,serif;font-size:17px;min-height:70px}
.rv-close{margin-top:10px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,#E2B536 14%,var(--paper));font-size:14px}
.rv-close p{margin:0 0 6px}
.rv-ctx{margin-top:10px;font-size:14px}
.rv-ctx summary{cursor:pointer;color:var(--green)}
.rv-ctx p{margin-top:8px;color:var(--muted);line-height:1.6}
.rv-ctx mark{background:var(--hl);color:var(--hl-ink)}
.rv-q .cm{margin-top:10px;width:100%;min-height:40px;height:40px;font-size:14px;background:color-mix(in srgb,var(--hl) 14%,var(--paper));border-color:color-mix(in srgb,var(--hl) 55%,var(--line))}
.rv-q .cm:focus{height:84px}
.btn.done{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.btn.danger{color:var(--warn)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,20,28,.45);display:grid;place-items:center;padding:20px}

<script type="text/plain" id="tpl-css">:root{color-scheme:light;--r:8px;--fh:Georgia,serif;--fb:system-ui,sans-serif;
  --bg:#F4F6F7;--surface:#fff;--ink:#172026;--muted:#56636B;--line:#D6DDE1;--primary:#0E5E5B;--on-primary:#fff;--accent:#E8B931;--on-accent:#1A1A1A;--dark:#10262A;--on-dark:#F2F5F5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.62 var(--fb);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--fh);font-weight:var(--hw,500);line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--header-bg,var(--surface))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;color:var(--header-ink,var(--ink));background:color-mix(in srgb,var(--header-bg,var(--surface)) 94%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:60px}
.top .logo{height:28px;width:auto;max-width:140px;object-fit:contain}
.top .ttl{font-family:var(--fh);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28ch;flex:0 1 auto}
.top nav{margin-left:auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
.top nav::-webkit-scrollbar{display:none}
.top nav a{font-size:14px;text-decoration:none;color:color-mix(in srgb,var(--header-ink,var(--ink)) 70%,transparent);padding:8px 10px;border-radius:6px;white-space:nowrap}
.top nav a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.top nav a.on{color:var(--header-ink,var(--ink));box-shadow:inset 0 -2px 0 var(--accent)}
.top .fs{border:1px solid var(--line);background:none;border-radius:6px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}
@media (max-width:760px){.top .ttl{display:none}.top nav{margin-left:0}}

/* generic section */
.sec{padding:96px 0}
.sec + .sec:not(.opener):not(.band){border-top:1px solid var(--line)}
.sec-head{max-width:720px;margin-bottom:40px}
.sec-head h2{font-size:clamp(28px,3.4vw,40px)}
.sec-head .lede{margin-top:14px;font-size:18px;color:var(--muted);max-width:62ch}
.src-line{margin-top:12px;font-size:13px;color:var(--muted)}
.src-line::before{content:"";display:inline-block;width:18px;height:1px;background:currentColor;vertical-align:middle;margin-right:8px;opacity:.6}
.prose p+p{margin-top:14px}
.prose{max-width:68ch;font-size:17px}
@media (max-width:640px){.sec{padding:64px 0}}

/* hero */
.hero{position:relative;padding:88px 0 96px;background:var(--hero-bg,var(--surface));color:var(--hero-ink,var(--ink));overflow:hidden}
.sec.alt{background:var(--band,transparent)}
.facts .v{overflow-wrap:anywhere;min-width:0}
.facts .k{flex:none;max-width:45%}
.facts div.long{flex-direction:column;align-items:flex-start;gap:4px}
.facts div.long .k{max-width:none}
.facts div.long .v{text-align:left;font-size:17px;line-height:1.45}
.kpi .v.long{font-size:clamp(22px,2.4vw,28px);line-height:1.25;overflow-wrap:anywhere}
.hero .wrap>*,.sec .wrap>*{min-width:0}
.top nav{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:24px}
.hero.has-img{background:var(--dark);color:var(--on-dark);min-height:min(88svh,860px);display:flex;align-items:flex-end}
.hero .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--dark) 92%,transparent) 0%,color-mix(in srgb,var(--dark) 70%,transparent) 55%,color-mix(in srgb,var(--dark) 30%,transparent) 100%)}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:56px;align-items:end}
.hero h1{font-size:clamp(36px,5.4vw,68px);max-width:16ch}
.hero .lede{margin-top:20px;font-size:19px;max-width:54ch;opacity:.86}
.hero dl{display:flex;flex-wrap:wrap;gap:12px 36px;margin:36px 0 0}
.hero dt{font-size:13px;opacity:.7}
.hero dd{margin:2px 0 0;font-size:15px}
.facts{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:8px 22px}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:baseline}
.facts div:last-child{border-bottom:0}
.facts .k{font-size:14px;color:var(--muted)}
.facts .v{font-family:var(--fh);font-size:20px;text-align:right}
.facts .v.accent{box-shadow:inset 0 -.38em 0 color-mix(in srgb,var(--accent) 70%,transparent)}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:36px}}

/* opener */
.opener{position:relative;min-height:100svh;display:flex;align-items:flex-end;background:var(--dark);color:var(--on-dark);overflow:hidden;scroll-margin-top:0}
.opener img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.opener::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--dark) 55%,transparent) 0,transparent 22%),linear-gradient(90deg,color-mix(in srgb,var(--dark) 90%,transparent) 0,color-mix(in srgb,var(--dark) 45%,transparent) 60%,transparent 100%)}
.opener .wrap{position:relative;z-index:1;padding:0 0 14vh}
.opener h2{font-size:clamp(36px,5.6vw,72px);max-width:15ch}
.opener .lede{margin-top:18px;font-size:19px;max-width:600px;opacity:.88}
.opener.noimg{min-height:62svh}

/* summary */
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border-top:2px solid var(--ink)}
.points a,.points div.pt{display:block;padding:22px 22px 26px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.points .pt h3{font-size:21px}
.points .pt p{margin-top:8px;color:var(--muted)}
.points a.pt:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.points .go{display:inline-block;margin-top:12px;font-size:14px;color:var(--primary)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.kpi .v{font-family:var(--fh);font-size:clamp(34px,4vw,52px);line-height:1.05;display:inline-block}
.kpi .v.accent{box-shadow:inset 0 -.32em 0 color-mix(in srgb,var(--accent) 75%,transparent)}
.kpi .l{margin-top:10px;font-size:16px}
.kpi .n{margin-top:6px;font-size:14px;color:var(--muted)}

/* chart */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.bars .row{display:grid;grid-template-columns:minmax(120px,30%) 1fr;gap:16px;align-items:center;padding:8px 0}
.bars .lab{font-size:15px}
.bars .track{position:relative;height:28px;display:flex;align-items:center;gap:10px}
.bars .fill{height:100%;background:var(--primary);border-radius:3px;min-width:2px}
.bars .row.hi .fill{background:var(--accent)}
.bars .val{font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:12px;height:260px;padding-top:28px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.cols .bar{width:min(56px,100%);background:var(--primary);border-radius:3px 3px 0 0;min-height:2px}
.cols .c.hi .bar{background:var(--accent)}
.cols .val{font-size:13px;margin-bottom:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cols .lab{font-size:13px;color:var(--muted);margin-top:8px;text-align:center;line-height:1.25;overflow-wrap:anywhere}
.share .stack{display:flex;height:44px;border-radius:4px;overflow:hidden;gap:2px}
.share .seg{height:100%}
.share ul{list-style:none;padding:0;margin:18px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 24px}
.share li{display:flex;gap:10px;align-items:baseline;font-size:15px}
.share li i{width:12px;height:12px;border-radius:2px;flex:none;transform:translateY(1px)}
.chart .note{margin-top:18px;font-size:13px;color:var(--muted)}
@media (max-width:560px){.bars .row{grid-template-columns:1fr;gap:4px}.chart{padding:18px}}

/* timeline */
.tl{list-style:none;padding:0;margin:0;position:relative;max-width:820px}
.tl::before{content:"";position:absolute;left:150px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl li{display:grid;grid-template-columns:150px 1fr;gap:32px;padding:0 0 30px;position:relative}
.tl li::before{content:"";position:absolute;left:144px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
.tl li.accent::before{background:var(--accent);border-color:var(--accent)}
.tl .d{font-size:14px;color:var(--muted);text-align:right;padding-right:6px;padding-top:2px}
.tl h3{font-size:19px}
.tl p{margin-top:4px;color:var(--muted)}
@media (max-width:640px){.tl::before{left:5px}.tl li{grid-template-columns:1fr;gap:2px;padding-left:28px}.tl li::before{left:-1px}.tl .d{text-align:left}}

/* table */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
.tbl th,.tbl td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:600;font-size:14px;background:color-mix(in srgb,var(--primary) 7%,var(--surface))}
.tbl tr:last-child td{border-bottom:0}
.tbl-note{margin-top:12px;font-size:13px;color:var(--muted)}

/* flow */
.flow{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:6px}
.flow .node{flex:1 1 0;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.flow .node h3{font-size:18px}
.flow .node p{margin-top:6px;font-size:14px;color:var(--muted)}
.flow .arr{flex:none;width:34px;display:grid;place-items:center;color:var(--primary)}
.flow .node:last-child{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
@media (max-width:760px){.flow{flex-direction:column}.flow .arr{width:auto;height:30px;transform:rotate(90deg)}}

/* comparison */
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.cmp .col{padding:26px;border-right:1px solid var(--line)}
.cmp .col:last-child{border-right:0}
.cmp h3{font-size:22px}
.cmp .sub{font-size:14px;color:var(--muted);margin-top:4px}
.cmp ul{margin:16px 0 0;padding-left:18px}
.cmp li+li{margin-top:8px}
@media (max-width:600px){.cmp .col{border-right:0;border-bottom:1px solid var(--line)}}

/* arguments */
.args{list-style:none;padding:0;margin:0;counter-reset:a}
.args>li{counter-increment:a;display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;padding:32px 0;border-top:1px solid var(--line)}
.args>li::before{content:counter(a);width:40px;height:40px;border-radius:50%;border:1.5px solid var(--primary);color:var(--primary);display:grid;place-items:center;font-family:var(--fh);font-size:18px}
.args h3{font-size:24px}
.args .prose{margin-top:12px}
@media (max-width:560px){.args>li{grid-template-columns:1fr}}

/* quotes */
.qs{display:grid;gap:16px;margin-top:24px;max-width:780px;min-width:0}
.qb{position:relative;margin:0;min-width:0;max-width:100%;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:22px 24px 16px 60px;overflow:hidden}
.qb::before{content:var(--qglyph,"\201C");position:absolute;left:16px;top:10px;font-family:var(--fh);font-size:60px;line-height:1;color:var(--primary);opacity:.5;pointer-events:none}
.qb blockquote{overflow-wrap:anywhere;hyphens:auto}
.qb figcaption{border-top:1px solid var(--line);padding-top:10px;margin-top:14px!important}
.args>li>div,.prose,.sec-head{min-width:0;overflow-wrap:anywhere}
.dbody .big{overflow-wrap:anywhere}
@media (max-width:560px){.qb{padding:18px 16px 14px 44px}.qb::before{left:10px;font-size:46px}.qs .qb blockquote{font-size:17px}}
.qb blockquote{margin:0;font-family:var(--fh);font-size:20px;line-height:1.45}
.qb figcaption{margin-top:8px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.qbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.qbtn:hover{border-color:var(--primary);color:var(--primary)}
.flag{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.flag.ok{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
.flag.warn{color:#9A3412;border-color:#F0B48F;background:#FFF4EC}

/* sources table */
.srcs{border-top:2px solid var(--ink)}
.srow{border-bottom:1px solid var(--line)}
.srow>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:76px minmax(0,1fr) auto 24px;gap:16px;align-items:center;width:100%;padding:18px 0;cursor:pointer}
.srow>button:focus-visible{outline:3px solid var(--accent)}
.srow .kind{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px;justify-self:start}
.srow .lab{font-family:var(--fh);font-size:19px}
.srow .cit{display:block;font-family:var(--fb);font-size:14px;color:var(--muted);margin-top:2px}
.srow .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
.srow .chev{transition:transform .2s}

.srow .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;visibility:hidden}
.srow.open .body{grid-template-rows:1fr;visibility:visible}
.srow .body>div{overflow:hidden}
.srow .inner{padding:0 0 26px 92px}
@media (max-width:640px){.srow>button{grid-template-columns:minmax(0,1fr) 24px}.srow .kind,.srow .cnt{display:none}.srow .inner{padding-left:0}}

/* options */
.opts{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.opts table{border-collapse:collapse;width:100%;min-width:680px}
.opts th,.opts td{padding:14px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:15px}
.opts th{font-size:13px;color:var(--muted);font-weight:500}
.opts td.name b{font-family:var(--fh);font-weight:500;font-size:18px;display:block}
.opts td.name span{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.tone{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tone.high,.tone.yes{border-color:var(--primary);color:var(--primary);font-weight:600}
.tone.mid{border-style:dashed}
.tone.low,.tone.no{color:var(--muted)}
.tone.na{border:0;padding:0}
.tone.rec{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.tone.sup{border-color:var(--primary);color:var(--primary)}
.tone.nr{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.opts .an td{background:color-mix(in srgb,var(--primary) 4%,var(--surface));font-size:15px;color:var(--muted)}
.opts .more{border:0;background:none;color:var(--primary);cursor:pointer;padding:0;margin-top:8px;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* risks */
.risk{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:48px;align-items:start}
.rm{display:grid;grid-template-columns:28px repeat(3,1fr);grid-template-rows:repeat(3,1fr) 28px;gap:4px;aspect-ratio:1/1}
.rm .cell{border-radius:4px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;padding:8px;background:color-mix(in srgb,var(--primary) calc(var(--s) * 9%),var(--surface));border:1px solid var(--line)}
.rm .ax{font-size:11px;color:var(--muted);display:grid;place-items:center}
.rm .ax.y{writing-mode:vertical-rl;transform:rotate(180deg)}
.rm .dot{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:13px;display:grid;place-items:center;font-weight:600}
.rm .dot.hot{background:var(--accent);color:var(--on-accent)}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.rlist .dot{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:13px;display:grid;place-items:center;font-weight:600}
.rlist .dot.hot{background:var(--accent);color:var(--on-accent)}
.rlist h3{font-size:18px}
.rlist p{color:var(--muted);margin-top:4px;font-size:15px}
.rlist .mit{margin-top:8px;color:var(--ink)}
.rlist .mit b{font-weight:600}
.axlab{font-size:13px;color:var(--muted);margin-top:10px}
@media (max-width:820px){.risk{grid-template-columns:1fr}}

/* steps */
.steps{list-style:none;margin:0;padding:0;counter-reset:s;max-width:860px}
.steps li{counter-increment:s;display:grid;grid-template-columns:48px 1fr;gap:16px;padding:22px 0;border-top:1px solid var(--line)}
.steps li::before{content:counter(s);font-family:var(--fh);font-size:26px;color:var(--primary);line-height:1}
.steps h3{font-size:20px}
.steps p{margin-top:6px;color:var(--muted)}
.steps .who{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.steps .who span{border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.steps .who .dec{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}

/* caveat */
.caveat .box{border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:var(--r);padding:28px 32px;background:var(--surface);max-width:860px}
.caveat h2{font-size:26px}

/* figure image in text sections */
.fig{margin:32px 0 0;max-width:860px}
.fig img{width:100%;height:auto;border-radius:var(--r);display:block}

/* footer */
.foot{background:var(--dark);color:var(--on-dark);padding:64px 0 48px;font-size:14px}
.foot .wrap{display:grid;gap:14px;max-width:820px;margin-left:max(20px,(100% - 1120px)/2)}
.foot h2{font-size:20px;margin-bottom:6px}
.foot p{opacity:.82}
.foot .meta{opacity:.6;font-size:13px;margin-top:18px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);color:var(--ink);z-index:60;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.drawer[hidden]{display:none}
.dh{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 12px;border-bottom:1px solid var(--line)}
.dh h2{font-size:22px;flex:1}
.dh .cit{display:block;font-family:var(--fb);font-size:13px;color:var(--muted);margin-top:4px;font-weight:400}
.dh .x{border:1px solid var(--line);background:none;border-radius:6px;width:36px;height:36px;cursor:pointer;flex:none;font-size:18px}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:12px 10px;cursor:pointer;color:var(--muted);font-size:14px;box-shadow:inset 0 -2px 0 transparent}
.tabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--primary)}
.dbody{flex:1;overflow:auto;padding:24px}
.dbody .big{font-family:var(--fh);font-size:22px;line-height:1.45;margin:0}
.dbody .orig{margin-top:18px;padding:14px 16px;background:color-mix(in srgb,var(--ink) 4%,var(--surface));border-radius:6px;font-size:15px}
.dbody .kv{margin-top:18px;display:grid;grid-template-columns:120px 1fr;gap:8px 16px;font-size:14px}
.dbody .kv dt{color:var(--muted)}
.dbody .kv dd{margin:0}
.dbody .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--primary);color:var(--primary);background:var(--surface);border-radius:6px;padding:9px 14px;font-size:14px;cursor:pointer;text-decoration:none}
.btn.solid{background:var(--primary);color:var(--on-primary)}
.small{font-size:13px;color:var(--muted);margin-top:10px}
.doc{white-space:pre-wrap;font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.doc mark{background:color-mix(in srgb,var(--accent) 60%,transparent);color:inherit;padding:1px 0;border-radius:2px}
.others{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.others h3{font-size:15px;font-family:var(--fb);font-weight:600}
.others button{display:block;text-align:left;border:0;background:none;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--line);width:100%;font-size:15px}

@media print{.top,.drawer,.scrim,.qbtn,.fs{display:none!important}.opener{min-height:auto;padding:60px 0}.sec{padding:40px 0;break-inside:avoid}}

 en:"This presentation summarises the document named in it and is intended solely for its addressees. It does not constitute legal advice on its own and must be read together with the full document.\nIt reflects the law and the facts as known on the date of the document. Quotations are reproduced from the document; where a quotation is marked as not found verbatim, rely on the document.",
 pl:"Niniejsza prezentacja streszcza wskazany w niej dokument i jest przeznaczona wyłącznie dla jej adresatów. Sama w sobie nie stanowi porady prawnej i należy ją czytać łącznie z pełną treścią dokumentu.\nPrzedstawia stan prawny i faktyczny znany w dniu sporządzenia dokumentu. Cytaty pochodzą z dokumentu; jeśli cytat oznaczono jako nieodnaleziony dosłownie, rozstrzyga treść dokumentu.",
 de:"Diese Präsentation fasst das darin genannte Dokument zusammen und ist ausschließlich für dessen Empfänger bestimmt. Sie stellt für sich genommen keine Rechtsberatung dar und ist zusammen mit dem vollständigen Dokument zu lesen.\nSie gibt die Rechts- und Sachlage zum Datum des Dokuments wieder. Zitate stammen aus dem Dokument; ist ein Zitat als nicht wörtlich gefunden gekennzeichnet, ist das Dokument maßgeblich.",
 fr:"La présente présentation résume le document qui y est désigné et est destinée exclusivement à ses destinataires. Elle ne constitue pas à elle seule un conseil juridique et doit être lue avec le document complet.\nElle reflète l’état du droit et des faits connus à la date du document. Les citations sont reprises du document ; lorsqu’une citation est signalée comme non trouvée telle quelle, le document fait foi.",

  var parts = base.split("/"); parts.pop();
  rel.split("/").forEach(function(seg){ if(seg===".."||seg==="") { if(seg==="..") parts.pop(); } else if(seg!==".") parts.push(seg); });

}
